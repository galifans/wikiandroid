# WikiAndroid 访问量统计 Worker
# 部署前请先把 database_id 换成你自己的 D1 数据库 ID（见 README.md）

name = "wikiandroid-pv"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 自定义域名（可选）：部署后如需 https://pv.wikiandroid.com，
# 在 Cloudflare 控制台给该 Worker 添加 Custom Domain 即可（或在 Workers 路由中配置）
# routes = [
#   { pattern = "pv.wikiandroid.com", custom_domain = true }
# ]

[[d1_databases]]
binding = "DB"
database_name = "wikiandroid-pv"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
